<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="在浏览器本地识别抖音《佛系消消消》小牛关卡截图并给出落点。" />
    <title>佛系消消消小牛解题器</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #182338; background: linear-gradient(150deg, #eff8ff 0%, #f7f7ff 48%, #fff5ef 100%); }
      main { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0 72px; }
      h1 { margin: 0; font-size: clamp(28px, 5vw, 46px); letter-spacing: -0.05em; }
      .lead { color: #52627c; font-size: 17px; line-height: 1.7; }
      .card { margin-top: 28px; border: 1px solid rgba(140, 164, 206, .28); border-radius: 24px; padding: 28px; background: rgba(255,255,255,.82); box-shadow: 0 18px 44px rgba(42, 69, 116, .10); }
      #dropZone { display: grid; min-height: 210px; place-content: center; gap: 10px; padding: 24px; text-align: center; cursor: pointer; border: 2px dashed #93add9; border-radius: 18px; color: #426492; background: #f7fbff; transition: .16s ease; }
      #dropZone:hover, #dropZone.dragging { background: #edf6ff; border-color: #2b86e6; transform: translateY(-1px); }
      #dropZone strong { color: #214a7c; font-size: 20px; }
      #fileInput { display: none; }
      .mode-picker { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0; padding: 0; border: 0; }
      .mode-picker legend { width: 100%; margin-bottom: 2px; color: #52627c; font-size: 14px; }
      .mode-picker label { display: flex; flex: 1 1 245px; gap: 9px; align-items: flex-start; padding: 11px 13px; cursor: pointer; border: 1px solid #d9e4f4; border-radius: 12px; color: #3e4f6d; background: #fbfdff; font-size: 14px; line-height: 1.5; }
      .mode-picker label:has(input:checked) { border-color: #5b9fed; background: #f0f7ff; box-shadow: 0 0 0 3px rgba(43, 134, 230, .10); }
      .mode-picker input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: #247dde; }
      .mode-picker strong { display: block; color: #214a7c; }
      .hint, .status { margin: 12px 0 0; color: #61708a; font-size: 14px; }
      .status { min-height: 22px; color: #225f9f; }
      .error { color: #bf3041; }
      #result { display: none; margin-top: 28px; scroll-margin-top: 18px; }
      .result-grid { display: grid; grid-template-columns: minmax(280px, .86fr) 1.14fr; gap: 22px; align-items: start; }
      .visual-column { display: grid; gap: 16px; }
      .panel { overflow: hidden; border-radius: 16px; border: 1px solid #e0e8f4; background: #fff; }
      #answerImage { display: block; width: 100%; max-height: 700px; object-fit: contain; background: #eff3f9; }
      .panel h2 { margin: 0; padding: 18px 18px 10px; font-size: 18px; }
      #meta { margin: 0; padding: 0 18px 14px; color: #61708a; }
      #answerList { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 18px 18px; }
      .cell { padding: 10px; border: 1px solid #e8edf5; border-radius: 10px; background: #fbfcff; font-size: 15px; }
      .dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); }
      .notice { padding: 12px 18px 18px; color: #7b6142; font-size: 13px; line-height: 1.6; }
      #strategyPanel { padding: 18px; }
      #strategyPanel h2 { padding: 0 0 8px; }
      .strategy-intro, .strategy-note { margin: 0; color: #52627c; font-size: 14px; line-height: 1.65; }
      .strategy-list { display: grid; gap: 10px; margin: 14px 0; padding: 0; list-style: none; counter-reset: strategy; }
      .strategy-list li { position: relative; padding: 10px 10px 10px 38px; border-radius: 10px; background: #f7faff; color: #3e4f6d; font-size: 14px; line-height: 1.55; counter-increment: strategy; }
      .strategy-list li::before { position: absolute; top: 10px; left: 10px; display: grid; width: 20px; height: 20px; place-items: center; border-radius: 50%; color: #fff; background: #e23340; font-size: 12px; font-weight: 700; content: counter(strategy); }
      .strategy-list strong { display: block; color: #1f385d; }
      @media (max-width: 720px) { main { padding-top: 32px; } .card { padding: 18px; } .result-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>佛系消消消 · 小牛解题器</h1>
      <p class="lead">上传抖音《佛系消消消》的完整小牛关卡截图，选择单牛或双牛规则后，自动识别棋盘颜色并给出落点。</p>
      <section class="card">
        <label id="dropZone" for="fileInput">
          <strong>点击选择截图、拖入图片，或直接粘贴</strong>
          <span>支持 PNG、JPG、WebP；复制截图后按 ⌘V 即可识别。图片只在当前浏览器中处理。</span>
        </label>
        <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" />
        <fieldset class="mode-picker">
          <legend>关卡模式</legend>
          <label>
            <input type="radio" name="cowMode" value="1" checked />
            <span><strong>单牛模式</strong>每种颜色、每行和每列各放 1 头小牛。</span>
          </label>
          <label>
            <input type="radio" name="cowMode" value="2" />
            <span><strong>双牛模式</strong>每种颜色、每行和每列各放 2 头小牛。</span>
          </label>
        </fieldset>
        <p class="hint">建议上传游戏原始全屏截图，棋盘不能被弹窗或手指遮住。</p>
        <p id="status" class="status" aria-live="polite"></p>
      </section>
      <section id="result" class="card">
        <div class="result-grid">
          <div class="visual-column">
            <div class="panel"><img id="answerImage" alt="已标出小牛顺序的截图" /></div>
            <aside id="strategyPanel" class="panel" hidden aria-labelledby="strategyTitle">
              <h2 id="strategyTitle">点击攻略</h2>
              <p id="strategyIntro" class="strategy-intro"></p>
              <ol id="strategyList" class="strategy-list"></ol>
              <p id="strategyNote" class="strategy-note"></p>
            </aside>
          </div>
          <div class="panel">
            <h2>放置坐标</h2>
            <p id="meta"></p>
            <div id="answerList"></div>
            <p class="notice">坐标从棋盘左上角开始计数。红色圆圈内的数字仅表示输出顺序，实际可按任意顺序点击。</p>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
